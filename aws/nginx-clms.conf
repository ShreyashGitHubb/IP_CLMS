# ==============================================================================
# CLMS Nginx Web Server Configuration (Exp 1, Exp 2, Exp 4)
# Reverse Proxy for Next.js Frontend (:3000) and Spring Boot REST API (:8080)
# ==============================================================================

server {
    listen 80;
    server_name _;

    # Logs routed to LVM Log Volume (Exp 5 & Exp 6)
    access_log /var/log/clms/nginx_access.log;
    error_log  /var/log/clms/nginx_error.log;

    # Gzip Compression for Fast Static Content Delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 1. Forward REST API requests to Spring Boot Backend (:8080)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # 2. Forward Frontend Web requests to Next.js Application (:3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Serve Static Equipment Document Uploads from LVM Storage (Exp 5)
    location /uploads/ {
        alias /var/data/clms_uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
