spring.datasource.url=jdbc:h2:mem:clms_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
app.auth.token-secret=${AUTH_TOKEN_SECRET:CLMS-Test-Token-Secret-32-Bytes-Long}
app.auth.seed-admin=false