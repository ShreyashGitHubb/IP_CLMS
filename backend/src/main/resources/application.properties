spring.application.name=lab-equipment-api
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:lab_equipment;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${PGUSER:sa}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=${DRIVER_CLASS_NAME:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jackson.default-property-inclusion=non_null
management.endpoints.web.exposure.include=health,info
app.auth.token-secret=${AUTH_TOKEN_SECRET:CLMS-Development-Token-Secret-32-Bytes}
app.auth.seed-admin=${SEED_ADMIN:false}
app.auth.admin-email=${ADMIN_EMAIL:admin@clms.local}
app.auth.admin-password=${ADMIN_PASSWORD:Admin@123}
app.auth.seed-member=${SEED_MEMBER:false}
app.auth.member-email=${MEMBER_EMAIL:member@clms.local}
app.auth.member-password=${MEMBER_PASSWORD:Member@123}

# Transactional email through the Resend HTTP API. Disabled until MAIL_ENABLED is set to true and a
# RESEND_API_KEY is present, so every operational endpoint behaves exactly as before without these.
# Cloudflare Email Routing only receives mail; sending from your own domain needs a provider plus the
# SPF, DKIM and DMARC records that provider asks for on the clms.shreyashvishwakarma.in zone.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.api-key=${RESEND_API_KEY:}
app.mail.endpoint=${MAIL_ENDPOINT:https://api.resend.com/emails}
app.mail.from=${MAIL_FROM:CLMS Lab <noreply@clms.shreyashvishwakarma.in>}
app.mail.sign-in-url=${MAIL_SIGN_IN_URL:https://clms.shreyashvishwakarma.in/sign-in}
app.mail.overdue-cron=${MAIL_OVERDUE_CRON:0 15 9 * * *}
app.mail.time-zone=${MAIL_TIME_ZONE:Asia/Kolkata}
